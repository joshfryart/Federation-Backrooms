  if (n === 8) { dropAll(); }
  actors.third.mesh.visible = false;
  if (!instant) snapCam = true; wideShot();
}

// ───────────────────────── camera ─────────────────────────
const camPos = new THREE.Vector3(0, 2, 8), camLook = new THREE.Vector3(0, 1.2, 0), tgtPos = camPos.clone(), tgtLook = camLook.clone(); let snapCam = true, drift = 0;
function wideShot() { const w = SC[curScene]?.wide || [0, 2, 8, 0, 1.2, 0]; tgtPos.set(w[0], w[1], w[2]); tgtLook.set(w[3], w[4], w[5]); }
let side = 1;
function closeOn(a, amt = 1) { const p = a.mesh.position; side = -side; const hh = a.h * 0.82; tgtLook.set(p.x - side * 0.15, hh - 0.08, p.z); tgtPos.set(p.x + side * 0.8 * amt, hh + 0.05, p.z + a.dist * 1.3 * amt); }
function updateCam(dt, t) {
  const k = snapCam ? 1 : 1 - Math.exp(-dt * 2.4); camPos.lerp(tgtPos, k); camLook.lerp(tgtLook, k); snapCam = false;
  cam.position.set(camPos.x + Math.sin(t * 0.31) * 0.08, camPos.y + Math.sin(t * 0.23) * 0.03, camPos.z + drift); cam.lookAt(camLook);
}

// ───────────────────────── frame loop ─────────────────────────
const clk = new THREE.Clock(); let T = 0, onTitle = true, alert = false, shakeT = 0;
function frame() {
  requestAnimationFrame(frame); const dt = Math.min(0.05, clk.getDelta()); T += dt;
  for (const a of Object.values(actors)) {
    if (!a || !a.mesh.visible) continue; const m = a.mesh;
    if (a.move) { const dx = a.move.x - m.position.x, dz = a.move.z - m.position.z, d = Math.hypot(dx, dz); if (d < 0.06) { m.position.x = a.move.x; m.position.z = a.move.z; a.move = null; a.H?.play(a.pose && a.pose !== 'walk' ? a.pose : 'idle', { fade: 0.25 }); a.moveDone?.(); a.moveDone = null; } else { const s = Math.min(d, a.move.spd * dt); m.position.x += dx / d * s; m.position.z += dz / d * s; const want = Math.atan2(dx, dz); let dy = Math.atan2(Math.sin(want - a.ry), Math.cos(want - a.ry)); a.ry += dy * Math.min(1, dt * 8); } }
    else { const want = a.base.ry * (a.speaking ? 0.35 : 1); a.ry += (want - a.ry) * (1 - Math.exp(-dt * 4)); }
    m.rotation.y = a.ry + (a.shake ? Math.sin(T * 60) * 0.06 * a.shake : 0); if (a.shake) m.position.x += Math.sin(T * 55) * 0.004 * a.shake;
    a.tick(dt, T);
    if (a.key === 'doc' || a.key === 'twin') { const mat = m.userData.human?.mats; }
  }
  tickTribbles(T); stage?.userData.tick?.(T);
  if (alert) { redL.intensity = 26 + Math.sin(T * 7) * 22; hemi.intensity = 0.12; } else redL.intensity = 0;
  if (onTitle) { const a = T * 0.18; tgtPos.set(Math.sin(a * 0.6) * 5, 1.6 + Math.sin(a * 0.7) * 0.2, 10.5); tgtLook.set(0, 1.55, 0); }
  updateCam(dt, T); R.render(scene, cam);
}

// ───────────────────────── UI overlays ─────────────────────────
const subEl = $('sub'), slugEl = $('slug'), cntEl = $('cnt'), cardEl = $('card'), flashEl = $('alertflash');
function showSub(key, text, dir) { if (!showSubs) return; const c = CH[key]; subEl.innerHTML = `<span class="nm" style="background:${c.col}">${c.name}</span><div class="tx">${text}</div>`; subEl.classList.add('on'); }
const hideSub = () => subEl.classList.remove('on');
let slugT = null; function slug(txt) { slugEl.textContent = txt; slugEl.classList.add('on'); clearTimeout(slugT); slugT = setTimeout(() => slugEl.classList.remove('on'), 4200 * Math.max(0.2, TS)); }
function setAlert(on) { alert = on; flashEl.classList.toggle('on', on); }
const LOGO = `<div class="logo big1"><span class="l1">Starship</span><span class="l2"><span>L</span><span>O</span><span>S</span><span>T</span></span></div>`;
function card(html, cls = '') { cardEl.removeAttribute('style'); cardEl.className = 'on ' + cls; cardEl.innerHTML = html; }
const noCard = () => { cardEl.removeAttribute('style'); cardEl.className = ''; cardEl.innerHTML = ''; };

// ───────────────────────── episode runner ─────────────────────────
let token = 0, paused = false;
const sleep = async (s, my) => { await sleepRaw(s); };
const trimText = (t) => t.replace(/\*/g, '');
function sceneSlug(b) { return b.place.replace(/\(.*?\)/g, '').split(/\.\s/).slice(0, 2).join(' · ').replace(/\.$/, ''); }

async function doFx(b, my, instant) {
  const s = b.s;
  switch (b.fx) {
    case 'title':
      if (instant) return; hideAll(); setStage('space'); wideShot(); snapCam = true; card(`${LOGO}<div class="ep"><small>PART ONE</small>"Til Death Do Us Part<br>(Pending Inspection)"</div><div class="stars"></div>`.replace('class="stars"', 'class="stars" style="z-index:-1"'));
      SND.brass(0.1); SND.brass(2.4, 1.25); SND.brass(4.6, 1.5); SND.organ(5.8); break;
    case 'wipe': if (!instant) SND.wipe(); break;
    case 'march': if (!instant) SND.march(); break;
    case 'tribbles':
      if (instant) { if (!trib.length) spawnTribbles(40); break; }
      cntEl.innerHTML = '<small>TRIBBLES IN ATTENDANCE</small><span id="cn">1</span>'; cntEl.classList.add('on');
      for (let i = 0; i < 12; i++) SND.chirp(i * 0.25 + Math.random() * 0.2);
      for (let i = 0; i < 3; i++) { await sleep(s / 6, my); if (my !== token) return; spawnTribbles(14, { area: [-2.8, 2.8, 0.6, 5] }); }
      for (const [n, w] of [['40', 0.34], ['400', 0.3], ['4,000', 0.3]]) { $('cn').textContent = n; SND.chirp(); await sleep(s * w / 1.3, my); }
      cntEl.classList.remove('on'); return;
    case 'applause': if (!instant) SND.clap(3); break;
    case 'scan':
      actors.macleod.play('idle_torch'); giveItem(actors.macleod, 'tricorder_sec', 'hand_r'); actors.okafor.play('idle');
      if (instant) { setAlert(true); return; } SND.scan(3.4); setTimeout(() => { if (my === token) { setAlert(true); SND.klaxon(3); } }, 3400 * TS); break;
    case 'hush': if (!instant) SND.hush(); break;
    case 'chirp': if (!instant) SND.chirp(); break;
    case 'tbc':
      setAlert(false); hideAll(); actors.third.mesh.visible = false; card('<div class="t">To Be Continued&hellip;</div>', 'tbc'); SND.low(); SND.violin(0.2); break;
    case 'credits':
      setAlert(false); noCard(); cardEl.className = 'on credits'; cardEl.innerHTML = `<div class="roll"><h4>STARRING</h4><p>A man in a coat</p><p>A woman with a tricorder</p><p>A second woman, with a grudge</p><p>A third woman (see next week)</p><p>The Gorn, as himself</p><p>The Gorn, as the ring bearer</p><h4>TRIBBLES</h4><p>Approximately 4,000</p><h4>NO IMPOSTORS WERE HARMED</h4><p>Several were married</p><h4>SOUP PROVIDED BY</h4><p>Soup</p></div>`;
      enterScene(8, true); hideSub(); for (const k of ['okafor', 'real', 'macleod', 'tremblay', 'doc']) { actors[k].base.ry = 0; actors[k].play('dance'); } cardEl.className = 'on credits'; cardEl.style.background = 'transparent'; cardEl.style.left = '35%'; actors.gorn.speaking = true; actors.drone.play('idle');
      if (!instant) SND.theme(s); break;
  }
  if (!instant) await sleep(s, my);
}

const AFTER = [];   // line-start actions: [regex, fn(my)]
const act = (re, fn) => AFTER.push([re, fn]);
act(/^Last time/, () => { setAlert(false); });
act(/^Of course/, () => { actors.okafor.play('idle_torch'); });
act(/^Human\. Scottish/, () => { actors.okafor.play('idle'); });
act(/^I will retrieve/, (_, inst) => { const g = actors.gorn; moveTo(g, 0.8, 0.5, 0, 1.6); g.moveDone = () => { setTimeout(() => { if (!inst) { SND.crunch(); } trib.splice(0, 12).forEach(t => holders.remove(t.mesh)); moveTo(g, 2.6, -1.6, -0.45, 1.0); }, 0); }; if (inst) { trib.splice(0, 12).forEach(t => holders.remove(t.mesh)); place(g, 2.6, -1.6, -0.45, { animate: false }); } });
act(/^That is impossible/, () => { actors.okafor.shake = 1; setTimeout(() => actors.okafor.shake = 0, 1500 * TS); });
act(/^Do not marry her/, (_, inst) => { setAlert(false); const r = actors.real; if (inst) return; r.mesh.visible = true; r.mesh.position.set(-8, 0, 2.4); r.ry = Math.PI / 2; r.mesh.userData.placed = true; r.base = { x: 1.9, z: 1.1, ry: -0.5 }; moveTo(r, 1.9, 1.1, -0.5, 4.2, 'sprint'); setTimeout(() => { r.H.play('idle'); }, 1500 * TS); });
act(/^For six seasons/, () => { });
act(/^Me!$/, () => { for (const k of ['okafor', 'real']) { giveItem(actors[k], 'phaser1', 'hand_r'); actors[k].play('idle_torch'); } });
act(/^Warning\. Third Okafor/, (_, inst) => { const t = actors.third; place(t, 1.1, -3.7, 0, { animate: false, clip: 'idle' }); t.mesh.scale.setScalar(1); if (!inst) { SND.low(); const s0 = performance.now(); const up = () => { const k = Math.min(1, (performance.now() - s0) / 1800); t.mesh.position.z = -3.7 + k * 0.35; if (k < 1) requestAnimationFrame(up); }; up(); } });
act(/^Warning\. Impostor/, () => { });
act(/^Please\. Please let/, (_, inst) => { if (inst) return; setAlert(false); hideAll(); card('', 'tbc'); });
act(/^Both Okafors|^Auditing/, () => { });
const STING = [[/wedding\.$/, 'organ'], [/Neither was I/, 'violin'], [/^So today/, null], [/no impostor aboard/, 'organ'], [/^Ladies\. Ladies/, null], [/^Aye\. And I will tell/, 'violin'], [/Third Okafor/, null], [/^Logging|Logging suspicious/, 'harp'], [/^Guard!/, 'harp']];

async function runBeat(b, i, my, instant) {
  if (b.k === 'scene') { enterScene(b.n, instant); if (!instant) slug(sceneSlug(b)); return; }
  if (b.k === 'sfx') {
    if (!instant && b.fx !== 'title' && b.fx !== 'tbc' && b.fx !== 'credits' && b.fx !== 'tribbles') { wideShot(); }
    if (b.fx === 'applause' || b.fx === 'hush' || b.fx === 'chirp') wideShot();
    if (b.fx === 'tribbles') { drift = 0; tgtPos.set(0, 3.2, 7.4); tgtLook.set(0, 0.6, 1.5); }
    if (b.fx === 'scan') { const o = actors.okafor; tgtLook.set(o.mesh.position.x, 1.4, o.mesh.position.z); tgtPos.set(o.mesh.position.x + 1.2, 1.5, o.mesh.position.z + 2.4); }
    if (b.fx === 'credits') { wideShot(); }
    await doFx(b, my, instant); if (my === token && b.fx === 'title') noCard(); return;
  }
  // line
  const keyMap = { COMPUTER: null, TREMBLAY: 'tremblay', OKAFOR: 'okafor', REAL: 'real', MACLEOD: 'macleod', DOC: 'doc', GORN: 'gorn', DRONE: 'drone' };
  const actor = keyMap[b.who] ? actors[keyMap[b.who]] : null; const text = trimText(b.t);
  if (!instant) noCard();
  for (const [re, fn] of AFTER) if (re.test(text)) fn(my, instant);
  if (instant) return;
  if (b.who === 'COMPUTER' && curScene && SC[curScene].set !== 'space' && curScene !== 0) wideShot(); else if (actor?.mesh.visible) closeOn(actor, text.length < 22 ? 0.8 : 1); else wideShot();
  if (actor?.mesh.visible && b.who !== 'COMPUTER') { actor.speaking = true; if (actor.H && actor.pose !== 'idle_torch' && actor.pose !== 'sitting_idle') actor.H.play(actor.H.has('idle_talking') ? 'idle_talking' : 'idle', { fade: 0.2 }); }
  showSub(b.who, text, b.d);
  for (const [re, s] of STING) if (re.test(text) && s) { if (/^Last/.test(text)) { } setTimeout(() => SND[s]?.(), (b.who === 'COMPUTER' ? 9500 : 600) * TS); }
  if (/wedding\.$/.test(text)) { /* organ sting lands on the last word */ }
  await say(b.who, text, b.wps); if (my !== token) return;
  if (actor) { actor.speaking = false; if (actor.H) actor.H.play(actor.H.has(actor.pose) ? actor.pose : 'idle', { fade: 0.3 }); }
  hideSub(); await sleep(0.45, my);
}

async function play(from = 0) {
  const my = ++token; try { speechSynthesis.cancel(); } catch (e) { } $('menu').classList.add('hide'); onTitle = false; $('hud').style.display = 'flex'; document.body.classList.add('bars');
  hideAll(); dropAll(); setAlert(false); noCard(); hideSub(); audio(); drift = 0; for (const a of Object.values(actors)) if (a) { a.speaking = false; a.shake = 0; }
  // catch up: apply every earlier beat instantly so a chapter jump has the right set, props and alert state
  const first = BEATS.findIndex(b => b.k === 'scene');
  if (from === 0) { /* recap uses its own cast */ curScene = 0; setStage('recap'); SC.recap && place0(); }
  for (let j = 0; j < from; j++) await runBeat(BEATS[j], j, my, true);
  // beat 0 is the title card, beat 1 the recap line (staged by place0), then the scenes
  for (let i = from; i < BEATS.length; i++) { if (my !== token) return; const b = BEATS[i]; if (i === 1 && from <= 1) { place0(); canvas.classList.add('recap'); slug('PREVIOUSLY…'); } if (i === 2) canvas.classList.remove('recap'); await runBeat(b, i, my, false); }
  if (my !== token) return; noCard(); hideAll(); card('<div class="t" style="font:900 clamp(24px,5vw,64px) Impact;color:#ffd24a;letter-spacing:.1em">PART TWO<br><span style="font-size:.5em;color:#fff">COMING SOON-ISH</span></div><br><button class="big" id="again">&#8635; Watch again</button>'); $('again').onclick = () => play(0);
}
function place0() { setStage('recap'); curScene = 'recap'; const d = SC.recap; hideAll(); for (const [k, c] of Object.entries(d.cast)) { const a = actors[k]; place(a, c[0], c[1], c[2], { animate: false, clip: c[3] }); } snapCam = true; wideShot(); tgtPos.x = -1; }
// slow lateral drift across the recap lineup
setInterval(() => { if (curScene === 'recap' && !onTitle) { drift = 0; tgtPos.x = Math.min(2, tgtPos.x + 0.35); } }, 1200);

// ───────────────────────── title screen ─────────────────────────
const TAGS = ['Now with 40% more tribbles', 'Some impostors may be real', 'Soup sold separately', 'The ship is lost. The plot is not far behind.', 'Warning: contains Gorn', 'Sixth season. Fourth cast. First clue.', 'Trust no one (especially the groom)', 'Please do not feed the tribbles'];
function titleScreen() {
  $('menu').classList.remove('hide'); onTitle = true; document.body.classList.remove('bars'); $('hud').style.display = 'none'; hideAll(); setStage('title'); setAlert(false); noCard(); hideSub();
  const L = { tremblay: [-4.4, 0, 0.6, 'idle_talking'], okafor: [-2.3, 0.5, 0.25, 'idle'], macleod: [-0.2, 0.9, 0, 'idle'], doc: [2.0, 0.5, -0.25, 'idle'], drone: [3.8, -0.4, -0.6], gorn: [0.3, -1.9, 0] };
  for (const [k, c] of Object.entries(L)) place(actors[k], c[0], c[1], c[2], { animate: false, clip: c[3] }); actors.okafor.play('idle'); giveItem(actors.okafor, 'tricorder_sec', 'hand_r'); actors.okafor.play('idle_torch');
  place(actors.tribble, 1.1, 1.8, 0.3, { animate: false }); actors.tribble.y0 = 0; trib.length = 0; spawnTribbles(1, { area: [-0.5, 0.5, 2, 2.4] });
}
let tn = 1, tagI = 0; setInterval(() => { if (onTitle) { tn = Math.min(9999, Math.round(tn * 1.35 + 1)); $('tn').textContent = tn.toLocaleString(); if (tn > 3000) tn = 1; } }, 700);
setInterval(() => { const t = $('tag'); t.style.animation = 'none'; void t.offsetWidth; t.style.animation = ''; t.textContent = TAGS[tagI++ % TAGS.length]; }, 3000); $('tag').textContent = TAGS[0];
const chap = $('chap'); [['0', 'From the top'], ['2', 'Scene 1 · Gossip'], ['4', 'Scene 2 · Ready room'], ['9', 'Scene 3 · Corridor'], ['0', '—']].slice(0, 0);
{ const marks = [['Opening titles', 0]]; BEATS.forEach((b, i) => { if (b.k === 'scene') marks.push([sceneSlug(b).replace(/^[A-Z ]+\d\s—\s?/, ''), i]); }); marks.forEach(([n, i], k) => { const o = document.createElement('option'); o.value = i; o.textContent = (k ? `Scene ${k}: ` : '') + n; chap.appendChild(o); }); $('vr').oninput = (e) => { userRate = +e.target.value; $('vrv').textContent = userRate.toFixed(2) + '×'; }; $('subs').onchange = (e) => showSubs = e.target.checked; }
$('go').onclick = () => { audio(); SND.brass(0); play(+chap.value); };
$('bmenu').onclick = () => { token++; try { speechSynthesis.cancel(); } catch (e) { } titleScreen(); };
$('bmute').onclick = (e) => { muted = !muted; e.target.textContent = muted ? 'Unmute' : 'Mute'; if (muted) try { speechSynthesis.cancel(); } catch (x) { } };
addEventListener('keydown', (e) => { if (e.key === 'Escape') $('bmenu').onclick(); });

// ───────────────────────── boot ─────────────────────────
await Promise.all([loadModels(), loadTextures()]);
build(); frame(); $('loading').remove();
if (Q.get('at') !== null) { const at = +Q.get('at'); play(at); } else titleScreen();
window.__soap = { play, titleScreen, actors, BEATS, get T() { return T; } }; window.__ready = true;
</script>
