<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversation close-up (mockup)</title>
<style>
  :root { --lc1:#f2a03d; --lc2:#58c9b9; --lc3:#6f8fb8; --lc4:#ffd9a0; --bg:#05070c; --ink:#e8eef6; --dim:#8fa0b6; --line:rgba(150,180,210,.26); --pan:rgba(7,11,19,.62); --red:#ff5a4a;
    --good:#5fd38d; --warn:#ffb347;
    --u:#a3231c; /* division colour of the speaker, set from JS */
    --f-d:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif; --f-m:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--f-d); overflow:hidden; }
  #stage { position:fixed; inset:0; overflow:hidden; }

  /* ---- background: the corridor, blurred (stand-in for the real 3D scene with depth of field) ---- */
  #bg { position:absolute; inset:-5%; filter:blur(14px) brightness(.8); transform:scale(1.04); }
  #bg .wall { position:absolute; inset:0; background:
      linear-gradient(90deg, #0c1220 0 8%, #141c30 8% 9%, #0b101c 9% 34%, #1a2440 34% 35%, #0b101c 35% 66%, #141c30 66% 67%, #0b101c 67% 92%, #141c30 92% 93%, #0a0e18 93%);}
  #bg .floor { position:absolute; left:0; right:0; bottom:0; height:30%; background:linear-gradient(#10172a,#06080f); }
  #bg .strip { position:absolute; left:0; right:0; top:14%; height:5px; background:var(--lc1); opacity:.55; box-shadow:0 0 40px 10px rgba(242,160,61,.35); }
  #bg .strip2 { top:78%; background:var(--lc2); opacity:.35; box-shadow:0 0 30px 6px rgba(88,201,185,.25); }
  #bg .lamp { position:absolute; width:180px; height:260px; top:20%; background:radial-gradient(closest-side, rgba(88,201,185,.35), transparent); }
  #vig { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 30% 48%, transparent 28%, rgba(2,3,6,.55) 62%, rgba(2,3,6,.92) 100%); }
  #grain { position:absolute; inset:0; pointer-events:none; opacity:.07; mix-blend-mode:overlay;
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0 1px, transparent 1px 3px); }
  .bar { position:absolute; left:0; right:0; height:7vh; background:#000; z-index:5; transition:transform .6s cubic-bezier(.2,.8,.2,1); }
  #bar-t { top:0; } #bar-b { bottom:0; }
  .off #bar-t { transform:translateY(-100%); } .off #bar-b { transform:translateY(100%); }

  /* ---- portrait ---- */
  #portrait { position:absolute; left:2vw; top:7vh; bottom:7vh; width:min(46vw, 640px); display:flex; align-items:flex-end; justify-content:center; z-index:2;
    transition:transform .9s cubic-bezier(.2,.8,.2,1), opacity .5s; transform-origin:30% 60%; }
  .off #portrait { transform:scale(.62) translateY(8%); opacity:0; }
  #face { width:100%; height:100%; overflow:visible; }
  #who { position:absolute; left:0; bottom:2.2vh; z-index:3; }

  /* ---- HUD: name plate ---- */
  #plate { position:absolute; left:3vw; top:10vh; z-index:4; background:var(--pan); border:1px solid var(--line); border-left:4px solid var(--u); padding:10px 16px 10px 14px; border-radius:6px; backdrop-filter:blur(6px); min-width:240px; transition:opacity .4s .3s; }
  .off #plate { opacity:0; }
  #plate h1 { margin:0; font-size:26px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; }
  #plate .sub { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-top:2px; }
  .pips { display:flex; gap:6px; margin-top:8px; align-items:center; flex-wrap:wrap; }
  .pip { display:inline-flex; align-items:center; gap:5px; font:11px var(--f-m); letter-spacing:.08em; color:var(--ink); background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:999px; padding:3px 9px; }
  .pip i { width:8px; height:8px; border-radius:50%; background:var(--u); display:inline-block; }
  .rank { letter-spacing:-1px; color:#e2b23a; font-size:13px; }
  .rank .e { color:#4a5368; }
  #mood { margin-top:10px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); letter-spacing:.1em; text-transform:uppercase; }
  #mood svg { width:22px; height:22px; }
  #mood b { color:var(--ink); font-weight:600; }
  #thinks { margin-top:6px; font:11px var(--f-m); color:var(--dim); }

  /* ---- right column: subtitle, wheel, relationship ---- */
  #right { position:absolute; right:3vw; top:7vh; bottom:7vh; width:min(44vw, 560px); z-index:4; display:flex; flex-direction:column; justify-content:space-between; padding:3vh 0 2vh; transition:opacity .4s .3s, transform .6s; }
  .off #right { opacity:0; transform:translateX(30px); }
  #sub { background:var(--pan); border:1px solid var(--line); border-radius:6px; padding:12px 16px; min-height:84px; backdrop-filter:blur(6px); }
  #sub .nm { font:11px var(--f-m); letter-spacing:.12em; text-transform:uppercase; color:var(--u); filter:brightness(1.6); }
  #sub .tx { font-size:21px; line-height:1.28; margin-top:4px; }
  #sub .tx .cur { display:inline-block; width:8px; height:18px; background:var(--lc1); margin-left:2px; vertical-align:-2px; animation:bl 1s steps(2) infinite; }
  @keyframes bl { 50% { opacity:0; } }
  #you { font-size:14px; color:var(--dim); margin-top:6px; font-style:italic; min-height:20px; }

  #wheelBox { position:relative; width:min(100%, 390px); aspect-ratio:1; align-self:center; }
  #wheel { width:100%; height:100%; overflow:visible; }
  .seg { fill:rgba(7,11,19,.72); stroke:var(--line); stroke-width:1.2; cursor:pointer; transition:fill .15s, stroke .15s, transform .15s; transform-origin:200px 200px; }
  .seg:hover, .seg.sel { fill:rgba(242,160,61,.22); stroke:var(--lc1); }
  .seg.off { cursor:not-allowed; fill:rgba(7,11,19,.5); }
  .seg.off:hover { fill:rgba(255,90,74,.1); stroke:var(--red); }
  .ico { pointer-events:none; stroke:var(--ink); stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .off-ico .ico { stroke:#4f5a6d; }
  .num { font:11px var(--f-m); fill:var(--dim); pointer-events:none; text-anchor:middle; }
  .badge circle { fill:var(--lc2); } .badge text { font:bold 10px var(--f-m); fill:#04141a; text-anchor:middle; }
  #hub { fill:rgba(5,7,12,.92); stroke:var(--line); stroke-width:1.4; cursor:pointer; } #hub:hover { stroke:var(--red); }
  #hubTx { font:600 13px var(--f-d); letter-spacing:.12em; fill:var(--ink); text-anchor:middle; text-transform:uppercase; pointer-events:none; }
  #hubSub { font:10px var(--f-m); fill:var(--dim); text-anchor:middle; pointer-events:none; }

  #rel { background:var(--pan); border:1px solid var(--line); border-radius:6px; padding:10px 14px; backdrop-filter:blur(6px); }
  #rel .row { display:flex; justify-content:space-between; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
  #rel .row b { color:var(--ink); font-family:var(--f-m); letter-spacing:.04em; }
  #meter { position:relative; height:12px; margin:8px 0 4px; border-radius:6px; background:linear-gradient(90deg, #7a2a24 0 28%, #6a6350 28% 55%, #2c6a58 55% 78%, #3fa57a 78%); opacity:.9; }
  #meter .mask { position:absolute; top:0; bottom:0; right:0; background:rgba(5,7,12,.74); border-radius:0 6px 6px 0; transition:width .8s cubic-bezier(.2,.8,.2,1); }
  #meter .tick { position:absolute; top:-3px; bottom:-3px; width:2px; background:#fff; transition:left .8s cubic-bezier(.2,.8,.2,1); box-shadow:0 0 6px #fff; }
  #meter .ghost { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--dim); opacity:.8; }
  #rel .lab { display:flex; justify-content:space-between; font:10px var(--f-m); color:var(--dim); }
  #delta { position:absolute; right:14px; top:-22px; font:bold 16px var(--f-m); opacity:0; transition:all .9s; }
  #delta.go { opacity:1; transform:translateY(-14px); }
  #rel { position:relative; }

  #hint { position:absolute; left:3vw; bottom:calc(7vh + 6px); z-index:6; font:11px var(--f-m); color:var(--dim); letter-spacing:.1em; background:rgba(5,7,12,.7); padding:4px 12px; border:1px solid var(--line); border-radius:999px; white-space:nowrap; }
  kbd { background:rgba(255,255,255,.1); border:1px solid var(--line); border-radius:3px; padding:0 5px; color:var(--ink); }

  /* world-paused badge + hidden HUD ghost list (design annotation) */
  #paused { position:absolute; right:3vw; top:calc(7vh + 10px); z-index:7; font:11px var(--f-m); letter-spacing:.14em; color:var(--lc2); border:1px solid var(--lc2); border-radius:3px; padding:3px 8px; background:rgba(88,201,185,.08); }
  #paused i { display:inline-block; width:6px; height:6px; background:var(--lc2); border-radius:50%; margin-right:6px; animation:pl 1.6s infinite; }
  @keyframes pl { 50% { opacity:.25; } }
  #clock { position:absolute; left:3vw; top:calc(7vh + 10px); z-index:7; font:11px var(--f-m); color:var(--dim); letter-spacing:.12em; }
  #clock b { color:var(--ink); }
  .gest { position:absolute; left:3vw; bottom:calc(7vh + 40px); z-index:7; font:11px var(--f-m); color:var(--dim); }
  .gest b { color:var(--lc4); }

  /* mockup controls (not part of the game) */
  #ctl { position:fixed; right:8px; bottom:8px; z-index:20; background:rgba(0,0,0,.8); border:1px dashed var(--line); border-radius:6px; padding:6px 8px; font:11px var(--f-m); color:var(--dim); display:flex; gap:6px; align-items:center; flex-wrap:wrap; max-width:60vw; }
  #ctl button { font:11px var(--f-m); background:#121a2c; color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:2px 8px; cursor:pointer; }
  #ctl button.on { border-color:var(--lc1); color:var(--lc1); }
  #ctl label { display:flex; gap:4px; align-items:center; }
  #tip { position:fixed; z-index:30; pointer-events:none; background:rgba(5,7,12,.95); border:1px solid var(--line); border-radius:4px; padding:4px 8px; font-size:13px; opacity:0; transition:opacity .1s; max-width:240px; }
  #tip small { display:block; color:var(--dim); font:10px var(--f-m); }
  @media (max-width: 820px) {
    #portrait { left:0; width:100vw; top:7vh; bottom:46vh; opacity:.9; } #right { width:96vw; right:2vw; top:auto; height:48vh; padding:0; gap:6px }
    #wheelBox { width:min(100%,250px);} #sub .tx { font-size:16px } #plate { top:8vh; transform:scale(.8); transform-origin:left top } #ctl { max-width:100vw; font-size:10px }
  }
</style>
</head>
<body>
<div id="stage" class="off">
  <div id="bg"><div class="wall"></div><div class="floor"></div><div class="strip"></div><div class="strip strip2"></div><div class="lamp" style="left:60%"></div><div class="lamp" style="left:20%;opacity:.5"></div></div>
  <div id="vig"></div><div id="grain"></div>
  <div class="bar" id="bar-t"></div><div class="bar" id="bar-b"></div>

  <div id="clock">SHIP TIME <b id="clk">0742</b> · <span id="clkNote">clock frozen</span></div>
  <div id="paused"><i></i>WORLD PAUSED · MINIMAP HIDDEN</div>

  <div id="plate">
    <h1 id="nm">—</h1>
    <div class="sub" id="ttl">—</div>
    <div class="pips" id="pips"></div>
    <div id="mood"></div>
    <div id="thinks"></div>
  </div>

  <div id="portrait"><svg id="face" viewBox="0 0 400 520" preserveAspectRatio="xMidYMax meet"></svg></div>

  <div class="gest">gesture layer: <b id="gest">idle</b> · eyes: <b id="gaze">on you</b></div>

  <div id="right">
    <div>
      <div id="sub"><div class="nm" id="subNm"></div><div class="tx" id="subTx"></div></div>
      <div id="you"></div>
    </div>
    <div id="wheelBox"><svg id="wheel" viewBox="0 0 400 400"></svg></div>
    <div id="rel">
      <div class="row"><span>Relationship</span><b id="relTx">—</b></div>
      <div id="meter"><div class="mask" id="mask"></div><div class="ghost" id="ghost"></div><div class="tick" id="tick"></div></div>
      <div class="lab"><span>COLD</span><span>WARY</span><span>NEUTRAL</span><span>WARM</span><span>TRUSTED</span></div>
      <span id="delta"></span>
    </div>
  </div>
  <div id="hint"><kbd>1</kbd>–<kbd>8</kbd> or click · <kbd>E</kbd>/<kbd>Esc</kbd>/centre = leave · mouse is free (pointer lock released on purpose)</div>
</div>

<div id="ctl">
  <span>MOCKUP:</span>
  <span id="pick"></span>
  <button id="bOpen">E: talk</button>
  <label><input type="checkbox" id="cItem"> carrying item</label>
  <label><input type="checkbox" id="cRank" checked> I outrank them</label>
</div>
<div id="tip"></div>

<script>
// ---------------------------------------------------------------- data (mirrors js/crew.js DIVISION / RANK_SHORT / tags)
const DIV = { command:'#c79a1e', operations:'#a3231c', sciences:'#2456a6' };
const CAST = [
  { id:'a', short:'Lt. Okafor', title:'Assistant Chief Engineer', dept:'Engineering', div:'operations', rank:3, tags:['calm','habit:taps-console'], skin:'#8a5a3c', hair:'#14100e', hairStyle:'short', trust:0.62, mood:'neutral', sub:true, activity:'repair queue',
    lines:{ greet:'Morning, sir. Grid is holding — for now.', duty:'Repair queue, mostly. EPS taps wear out faster than the work orders come in.', help:'I can spare ten minutes. Which junction?', order:'Understood. Putting it at the top of the list.', give:'Oh — a spanner. I was just missing one. Thanks.', gossip:'Ask Ensign Chen about the mess hall. Something about a replicator and a bet.', hangs:'Mostly Chen and Dr. Kaur. We play cards on gamma watch.', small:'Coffee tastes like the replicator filter again. Tell no one I said so.' } },
  { id:'b', short:'Ens. Tremblay', title:'Navigator', dept:'Flight Control', div:'command', rank:1, tags:['stressed','habit:fidgets'], skin:'#e0b090', hair:'#6b3a1c', hairStyle:'bun', trust:0.28, mood:'tense', sub:false, activity:'plotting course',
    lines:{ greet:'Sir. Er — ma\'am. Sorry. Hello.', duty:'Position fixes every quarter hour. The star charts keep drifting.', help:'I... have a fix due. Maybe after?', order:'Of course. Right away.', give:'For me? Thanks. Really.', gossip:'I should not say. But the captain\'s yeoman skips her rounds.', hangs:'Nobody on watch. I eat at the back table.', small:'Do you think the dampers are okay? They felt wrong earlier.' } },
  { id:'c', short:'Cmdr. Haddad', title:'Operations Manager', dept:'Operations', div:'operations', rank:5, tags:['commanding','cliquey'], skin:'#5c3a28', hair:'#d8d8d8', hairStyle:'bald', trust:0.8, mood:'warm', sub:false, activity:'ops board',
    lines:{ greet:'Good to see you. Walk with me — no, stay. Talk.', duty:'Four boards, two relays, one very long day.', help:'Yours? Then it is ours. Tell me what you need.', order:'You are welcome to ask. I am not in your chain, however.', give:'Kind of you. I will see it gets to the right shelf.', gossip:'The engineers think I do not notice. I notice everything.', hangs:'Command table at 1900. Join us sometime.', small:'Sixty years on the job, and I still love the sound of a clean relay sweep.' } },
];
const RANKS=['Crewman','Ensign','Lt. J.G.','Lt.','Lt. Cmdr.','Cmdr.','Capt.'];
// intents: id, icon, label, note, unlock rule (js/main.js talkMenu will build these from tags / social / trust)
const INTENTS = [
  { id:'greet',  ico:'wave',  label:'Greet',            note:'warm up',                 eff:+2, you:'"Hello."' },
  { id:'duty',   ico:'clip',  label:'Ask about duty',   note:'what are you on?',        eff:+1, you:'"What\'s on your plate?"' },
  { id:'help',   ico:'wrench',label:'Ask for a hand',   note:'needs trust > 25%',       eff:-1, you:'"Can you give me a hand?"' },
  { id:'order',  ico:'chev',  label:'Give an order',    note:'subordinates only',       eff:-2, you:'"I need you to do something."' },
  { id:'give',   ico:'box',   label:'Give item',        note:'must be carrying',        eff:+6, you:'"Here, this is yours."' },
  { id:'gossip', ico:'bubble',label:'Gossip',           note:'friends tell more',       eff:+1, you:'"Heard anything lately?"' },
  { id:'hangs',  ico:'people',label:'Who do you hang with?', note:'js/social.js talkLine', eff:+2, you:'"Who do you spend time with?"' },
  { id:'small',  ico:'cup',   label:'Small talk',       note:'chat — passes a moment',  eff:+3, you:'"Quiet shift?"' },
];
const ICO = {
  wave:'<path d="M-9 4 l-3 -9 a2 2 0 0 1 4 -1 l1 4 M-6 -2 l-2 -10 a2 2 0 0 1 4 -.5 l2 8 M-2 -4 l0 -11 a2 2 0 0 1 4 0 l0 10 M3 -4 l2 -9 a2 2 0 0 1 4 .8 l-2 9 M-9 4 q0 12 12 12 q10 0 11 -9 l0 -4"/>',
  clip:'<rect x="-10" y="-13" width="20" height="26" rx="3"/><path d="M-4 -13 v-3 h8 v3 M-5 -4 h10 M-5 2 h10 M-5 8 h6"/>',
  wrench:'<path d="M12 -12 a7 7 0 0 0 -9 9 l-13 13 a3 3 0 0 0 4 4 l13 -13 a7 7 0 0 0 9 -9 l-5 5 l-4 -1 l-1 -4 z"/>',
  chev:'<path d="M-10 -8 l10 -6 l10 6 M-10 2 l10 -6 l10 6 M-10 12 l10 -6 l10 6"/>',
  box:'<path d="M-12 -6 l12 -7 l12 7 v14 l-12 7 l-12 -7 z M-12 -6 l12 7 l12 -7 M0 1 v14"/>',
  bubble:'<path d="M-14 -12 h18 a4 4 0 0 1 4 4 v8 a4 4 0 0 1 -4 4 h-9 l-6 5 v-5 a4 4 0 0 1 -3 -4 z M8 -2 h6 a4 4 0 0 1 4 4 v6 a4 4 0 0 1 -3 4 v4 l-5 -4 h-3"/>',
  people:'<circle cx="-6" cy="-7" r="5"/><circle cx="8" cy="-5" r="4"/><path d="M-16 13 a10 10 0 0 1 20 0 M3 13 a8 8 0 0 1 14 0"/>',
  cup:'<path d="M-10 -6 h18 v10 a8 8 0 0 1 -8 8 h-2 a8 8 0 0 1 -8 -8 z M8 -3 h3 a4 4 0 0 1 0 8 h-3 M-5 -14 q2 -3 0 -6 M1 -14 q2 -3 0 -6"/>',
  leave:'<path d="M-6 -12 h-6 v24 h6 M2 -8 l10 8 l-10 8 M12 0 h-18"/>',
};

// ---------------------------------------------------------------- state
let npc = CAST[0], open = false, rel = 0.5, speaking = 0, blinkT = 2, gestT = 3, t0 = performance.now();
let typeTimer = null, mouth = 0, brow = 0, smile = 0, tilt = 0, nod = 0, gestName = 'idle', gestU = 0, gestFor = 0, curGest = null;
const $ = (id) => document.getElementById(id);
const stage = $('stage');

// ---------------------------------------------------------------- face SVG
function buildFace() {
  const n = npc, uni = DIV[n.div];
  $('face').innerHTML = `
  <defs>
    <clipPath id="eyeClip"><ellipse cx="152" cy="212" rx="22" ry="13"/><ellipse cx="248" cy="212" rx="22" ry="13"/></clipPath>
    <radialGradient id="skin" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="${shade(n.skin,.12)}"/><stop offset="1" stop-color="${shade(n.skin,-.18)}"/></radialGradient>
    <linearGradient id="uni" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(uni,.1)}"/><stop offset="1" stop-color="${shade(uni,-.35)}"/></linearGradient>
    <radialGradient id="rim" cx="85%" cy="30%" r="60%"><stop offset="0" stop-color="#58c9b9" stop-opacity=".35"/><stop offset="1" stop-color="#58c9b9" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="body">
    <path d="M30 520 L50 430 Q80 392 150 380 L250 380 Q320 392 350 430 L370 520 Z" fill="url(#uni)"/>
    <path d="M150 380 L200 440 L250 380 Z" fill="#0c0f16" opacity=".55"/>
    <path d="M150 380 Q200 410 250 380 L250 392 Q200 424 150 392 Z" fill="${shade(uni,-.25)}"/>
    <g transform="translate(278,440)"><path d="M0 -14 l7 12 l14 3 l-10 10 l2 14 l-13 -7 l-13 7 l2 -14 l-10 -10 l14 -3 z" fill="#d9b24a" stroke="#6a5314" stroke-width="1.5"/></g>
    ${[0,1,2].map(i=>`<rect x="${70+i*14}" y="452" width="9" height="5" rx="1" fill="${i<Math.max(1,n.rank-1)?'#e2b23a':'#2a3040'}"/>`).join('')}
  </g>
  <g id="head">
    <rect x="170" y="330" width="60" height="64" rx="18" fill="${shade(n.skin,-.12)}"/>
    ${n.hairStyle==='bun'?`<circle cx="200" cy="64" r="34" fill="${n.hair}"/>`:''}
    <path id="hairBack" d="M92 220 Q86 90 200 78 Q314 90 308 220 Q300 150 200 140 Q100 150 92 220Z" fill="${n.hair}" ${n.hairStyle==='bald'?'opacity="0"':''}/>
    <ellipse cx="92" cy="236" rx="14" ry="26" fill="${n.skin}"/><ellipse cx="308" cy="236" rx="14" ry="26" fill="${n.skin}"/>
    <path d="M100 210 Q100 330 200 352 Q300 330 300 210 Q300 100 200 98 Q100 100 100 210Z" fill="url(#skin)"/>
    <path d="M100 210 Q100 330 200 352 Q300 330 300 210 Q300 100 200 98 Q100 100 100 210Z" fill="url(#rim)"/>
    ${n.hairStyle==='bald'?'':`<path d="M100 196 Q96 104 200 96 Q304 104 300 196 Q286 140 200 134 Q114 140 100 196Z" fill="${n.hair}"/>`}
    <g id="brows" fill="none" stroke="${n.hairStyle==='bald'?'#7a7a7a':n.hair}" stroke-width="7" stroke-linecap="round">
      <path id="browL" d="M130 186 Q152 176 176 186"/><path id="browR" d="M224 186 Q248 176 270 186"/>
    </g>
    <g id="eyes">
      <ellipse cx="152" cy="212" rx="22" ry="13" fill="#f1ece6"/><ellipse cx="248" cy="212" rx="22" ry="13" fill="#f1ece6"/>
      <circle id="irisL" cx="152" cy="213" r="9" fill="#3a2a1c"/><circle id="irisR" cx="248" cy="213" r="9" fill="#3a2a1c"/>
      <circle id="pupL" cx="152" cy="213" r="4" fill="#000"/><circle id="pupR" cx="248" cy="213" r="4" fill="#000"/>
      <circle cx="148" cy="209" r="2.4" fill="#fff" opacity=".85"/><circle cx="244" cy="209" r="2.4" fill="#fff" opacity=".85"/>
      <g clip-path="url(#eyeClip)"><rect id="lidL" x="126" y="170" width="52" height="42" fill="${shade(n.skin,-.02)}"/><rect id="lidR" x="222" y="170" width="52" height="42" fill="${shade(n.skin,-.02)}"/></g>
      <path d="M130 213 Q152 196 174 213" fill="none" stroke="${shade(n.skin,-.4)}" stroke-width="2.5" opacity=".7"/>
      <path d="M226 213 Q248 196 270 213" fill="none" stroke="${shade(n.skin,-.4)}" stroke-width="2.5" opacity=".7"/>
    </g>
    <path d="M196 226 Q188 270 180 282 Q200 292 220 282 Q212 270 204 226" fill="${shade(n.skin,-.15)}" opacity=".5"/>
    <g id="mouthG">
      <path id="lipTop" fill="#a8524a"/><path id="mouthIn" fill="#2a0e0e"/><path id="lipBot" fill="#b8645a"/>
    </g>
    <path d="M110 270 Q118 310 160 336" stroke="#000" stroke-opacity=".12" stroke-width="10" fill="none"/>
    ${n.tags.includes('stressed')?`<path d="M140 238 q12 8 26 2 M234 240 q12 6 26 -2" stroke="#000" stroke-opacity=".18" stroke-width="3" fill="none"/>`:''}
  </g>`;
}
function shade(hex, k) { const n = parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255; const f=(c)=>Math.max(0,Math.min(255,Math.round(k>=0?c+(255-c)*k:c*(1+k)))); return '#'+[f(r),f(g),f(b)].map(c=>c.toString(16).padStart(2,'0')).join(''); }

// ---------------------------------------------------------------- gestures (names = js/movement.js GESTURES)
const GEST = {
  talk_emphasis:{ dur:1.2, f:(u)=>({ nod:Math.sin(u*Math.PI*2)*6, tilt:0 }) },
  nod:{ dur:.85, f:(u)=>({ nod:Math.sin(u*Math.PI*2)*9 }) },
  head_tilt:{ dur:2, f:(u)=>({ tilt:Math.sin(u*Math.PI)*7 }) },
  eyebrow_raise:{ dur:1.1, f:(u)=>({ brow:Math.sin(u*Math.PI)*1 }) },
  small_smile:{ dur:2, f:(u)=>({ smile:Math.sin(u*Math.PI)*.8 }) },
  shrug:{ dur:1.3, f:(u)=>({ nod:Math.sin(u*Math.PI)*-4, shr:Math.sin(u*Math.PI) }) },
  slow_blink:{ dur:.9, f:(u)=>({ blink:Math.sin(u*Math.PI) }) },
};
let ext = { nod:0, tilt:0, brow:0, smile:0, shr:0, blink:0 };
function startGesture(name) { const g = GEST[name]; if (!g) return; curGest = { name, g, u:0, t:0 }; gestName = name; }
function pickIdleGesture() {
  const w = npc.mood==='tense' ? ['head_tilt','slow_blink','shrug'] : npc.mood==='warm' ? ['small_smile','nod','head_tilt'] : ['nod','head_tilt','eyebrow_raise','slow_blink'];
  startGesture(w[Math.floor(Math.random()*w.length)]);
}

// ---------------------------------------------------------------- mouth (JawDrop morph stand-in): open 0..1
function mouthPath(open, sm) {
  const cx = 200, y = 300, w = 34 + sm*10, up = y - 3 - open*3 - sm*6, cornerY = y - sm*10 + (npc.mood==='tense'&&sm<.1?3:0), low = y + 3 + open*18;
  document.getElementById('lipTop').setAttribute('d', `M${cx-w} ${cornerY} Q${cx-w/2} ${up-7} ${cx} ${up-2} Q${cx+w/2} ${up-7} ${cx+w} ${cornerY} Q${cx+w/2} ${y} ${cx} ${y} Q${cx-w/2} ${y} ${cx-w} ${cornerY}Z`);
  document.getElementById('mouthIn').setAttribute('d', open>.03?`M${cx-w+4} ${cornerY} Q${cx} ${y-1} ${cx+w-4} ${cornerY} Q${cx+w/2} ${low+2} ${cx} ${low+4} Q${cx-w/2} ${low+2} ${cx-w+4} ${cornerY}Z`:'');
  document.getElementById('lipBot').setAttribute('d', `M${cx-w+2} ${cornerY} Q${cx-w/2} ${low+2} ${cx} ${low+8} Q${cx+w/2} ${low+2} ${cx+w-2} ${cornerY} Q${cx} ${low-2+ (open>.03?0:2)} ${cx-w+2} ${cornerY}Z`);
}

// ---------------------------------------------------------------- frame
const mouseG = { x:0, y:0 };
addEventListener('pointermove', (e) => { mouseG.x = (e.clientX/innerWidth-.3)*2; mouseG.y = (e.clientY/innerHeight-.5)*2; });
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now-last)/1000); last = now; const t = (now-t0)/1000; if (!$('head')) return;
  // gesture scheduler
  if (open) { gestT -= dt; if (!curGest && gestT <= 0) { if (speaking>0) startGesture('talk_emphasis'); else pickIdleGesture(); gestT = speaking>0 ? 1.6+Math.random() : 3+Math.random()*3; } }
  const tgt = { nod:0, tilt:0, brow:0, smile:0, shr:0, blink:0 };
  if (curGest) { curGest.t += dt; const u = curGest.t/curGest.g.dur; if (u>=1) { curGest=null; gestName='idle'; } else Object.assign(tgt, curGest.g.f(u)); }
  for (const k in tgt) ext[k] += (tgt[k]-ext[k]) * Math.min(1, dt*14);
  // blink
  blinkT -= dt; let bl = 0; if (blinkT <= 0) { bl = 1; if (blinkT < -.14) { blinkT = 2.4+Math.random()*3; } else bl = 1 - Math.abs(blinkT+.07)/.07; }
  bl = Math.max(0, Math.min(1, Math.max(bl, ext.blink)));
  // speech: jaw flaps with syllables
  if (speaking > 0) { speaking -= dt; mouth = Math.max(0, Math.sin(t*17) * .5 + Math.sin(t*9.3+1) * .35 + .2) * (.55 + .45*Math.sin(t*3.1)); } else mouth += (0-mouth)*Math.min(1,dt*12);
  const moodSmile = npc.mood==='warm' ? .35 : npc.mood==='tense' ? -.1 : .08;
  const sm = Math.max(-0.2, moodSmile + ext.smile);
  mouthPath(mouth, Math.max(0, sm));
  // head: breathing + micro drift + gesture + slight tracking of the cursor (eye contact stays on the player)
  const sway = Math.sin(t*.43)*1.4, drift = Math.sin(t*.29)*1.0, br = Math.sin(t*1.5)*3;
  const rot = sway + ext.tilt + drift + (npc.mood==='tense' ? Math.sin(t*2.1)*.5 : 0);
  $('head').setAttribute('transform', `translate(0,${(ext.nod*.6)+br*.15}) rotate(${rot} 200 340)`);
  $('body').setAttribute('transform', `translate(0,${br*.3-ext.shr*6})`);
  // eyes look at the player (camera): slight saccades; look away briefly when thinking
  const ex = Math.sin(t*.8)*1.2 + mouseG.x*1.5 * 0 , ey = Math.sin(t*.55)*1;
  for (const s of ['L','R']) { const dx = s==='L'?152:248; for (const id of ['iris','pup']) { const el=$(id+s); el.setAttribute('cx', dx+ex); el.setAttribute('cy', 213+ey+(id==='pup'?0:0)); } }
  const lidY = -2 + bl*24; $('lidL').setAttribute('transform', `translate(0,${lidY})`); $('lidR').setAttribute('transform', `translate(0,${lidY})`);
  const raise = (npc.mood==='tense'? .35:0) + ext.brow;
  $('browL').setAttribute('d', `M130 ${186-raise*12} Q152 ${176-raise*14} 176 ${186-raise*(npc.mood==='tense'?-2:6)+(npc.mood==='tense'?4:0)}`);
  $('browR').setAttribute('d', `M224 ${186-raise*(npc.mood==='tense'?-2:6)+(npc.mood==='tense'?4:0)} Q248 ${176-raise*14} 270 ${186-raise*12}`);
  $('gest').textContent = gestName; $('gaze').textContent = gestName==='slow_blink' ? 'closed' : speaking>0 ? 'on you (talking)' : 'on you';
}

// ---------------------------------------------------------------- wheel
const R0 = 78, R1 = 192, GAP = .035;
function arc(a0, a1, r0, r1) {
  const p = (a, r) => [200 + Math.cos(a)*r, 200 + Math.sin(a)*r];
  const [x0,y0]=p(a0,r1),[x1,y1]=p(a1,r1),[x2,y2]=p(a1,r0),[x3,y3]=p(a0,r0);
  return `M${x0} ${y0} A${r1} ${r1} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`;
}
function lockReason(it) {
  if (it.id==='order' && !$('cRank').checked) return 'Not in your chain of command';
  if (it.id==='order' && !npc.sub) return 'They do not report to you';
  if (it.id==='give' && !$('cItem').checked) return 'You are not carrying anything';
  if (it.id==='help' && rel < .25) return 'They do not trust you enough yet';
  return null;
}
function buildWheel() {
  const svg = $('wheel'); let h = `<circle cx="200" cy="200" r="196" fill="rgba(5,7,12,.35)" stroke="var(--line)" stroke-dasharray="2 6"/>`;
  INTENTS.forEach((it, i) => {
    const n = INTENTS.length, a0 = -Math.PI/2 + i*2*Math.PI/n + GAP - Math.PI/n, a1 = a0 + 2*Math.PI/n - 2*GAP, am = (a0+a1)/2, rm = (R0+R1)/2+4;
    const lock = lockReason(it), cx = 200+Math.cos(am)*rm, cy = 200+Math.sin(am)*rm;
    h += `<g class="${lock?'off-ico':''}"><path class="seg ${lock?'off':''}" data-i="${i}" d="${arc(a0,a1,R0,R1)}"/>
      <g transform="translate(${cx},${cy}) scale(1.15)" class="ico" style="opacity:${lock?.55:1}">${ICO[it.ico]}</g>
      <text class="num" x="${200+Math.cos(am)*(R1-13)}" y="${200+Math.sin(am)*(R1-13)+4}">${i+1}</text>
      ${it.id==='gossip'||it.id==='hangs' ? '' : ''}
      ${lock?`<g transform="translate(${cx+16},${cy+18})"><circle r="7" fill="#1b2232" stroke="#4f5a6d"/><path d="M-3 -1 v-2 a3 3 0 0 1 6 0 v2 M-4 -1 h8 v6 h-8z" stroke="#8fa0b6" fill="none" stroke-width="1.3" transform="scale(.9)"/></g>`:''}
    </g>`;
  });
  h += `<circle id="hub" cx="200" cy="200" r="68"/><g transform="translate(200,172) scale(.9)" class="ico">${ICO.leave}</g><text id="hubTx" x="200" y="214">Leave</text><text id="hubSub" x="200" y="230">E / Esc</text>`;
  svg.innerHTML = h;
  svg.querySelectorAll('.seg').forEach(s => {
    const it = INTENTS[+s.dataset.i];
    s.addEventListener('pointerenter', (e) => { const lock = lockReason(it); $('hubTx').textContent = it.label.length > 14 ? it.label.slice(0,13)+'…' : it.label; $('hubSub').textContent = lock || it.note; $('hubSub').style.fill = lock ? 'var(--red)' : 'var(--dim)'; showTip(e, it, lock); });
    s.addEventListener('pointermove', (e) => moveTip(e));
    s.addEventListener('pointerleave', () => { $('hubTx').textContent = 'Leave'; $('hubSub').textContent = 'E / Esc'; $('hubSub').style.fill = 'var(--dim)'; $('tip').style.opacity = 0; });
    s.addEventListener('click', () => choose(+s.dataset.i));
  });
  $('hub').addEventListener('click', end);
}
function showTip(e, it, lock) { const t = $('tip'); t.innerHTML = `${it.label}<small>${lock||it.note}</small>`; t.style.opacity = 1; moveTip(e); }
function moveTip(e) { const t = $('tip'); t.style.left = (e.clientX+14)+'px'; t.style.top = (e.clientY+14)+'px'; }

// ---------------------------------------------------------------- conversation
function say(text) {
  clearInterval(typeTimer); $('subNm').textContent = npc.short + ' · ' + npc.title; const el = $('subTx'); el.innerHTML = '<span class="cur"></span>';
  let i = 0; speaking = text.length * 0.045 + .2; typeTimer = setInterval(() => { i += 2; el.innerHTML = esc(text.slice(0,i)) + '<span class="cur"></span>'; if (i >= text.length) { clearInterval(typeTimer); el.innerHTML = esc(text); } }, 28);
}
const esc = (s) => s.replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
function setRel(v, d) {
  const old = rel; rel = Math.max(0, Math.min(1, v)); const p = rel*100;
  $('mask').style.width = (100-p)+'%'; $('tick').style.left = `calc(${p}% - 1px)`;
  $('relTx').textContent = `${Math.round(p)}% · ${rel>.8?'trusted':rel>.55?'warm':rel>.35?'neutral':rel>.2?'wary':'cold'}`;
  if (d) { const el = $('delta'); el.textContent = (d>0?'+':'')+d; el.style.color = d>0?'var(--good)':'var(--red)'; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); }
  const mood = rel>.7?'warm':rel<.3?'tense':'neutral'; npc.mood = mood; renderMood(); buildWheel();
}
function renderMood() {
  const m = npc.mood, face = m==='warm' ? '<path d="M5 14 q6 6 12 0" /><circle cx="8" cy="8" r="1"/><circle cx="14" cy="8" r="1"/>' : m==='tense' ? '<path d="M6 16 q5 -4 10 0" /><circle cx="8" cy="8" r="1"/><circle cx="14" cy="8" r="1"/><path d="M5 5 l4 2 M17 5 l-4 2"/>' : '<path d="M6 15 h10" /><circle cx="8" cy="8" r="1"/><circle cx="14" cy="8" r="1"/>';
  $('mood').innerHTML = `<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="color:${m==='warm'?'var(--good)':m==='tense'?'var(--warn)':'var(--dim)'}"><circle cx="11" cy="11" r="10"/>${face}</svg><span>Mood: <b>${m==='warm'?'warm':m==='tense'?'on edge':'neutral'}</b></span>`;
}
function choose(i) {
  if (!open) return; const it = INTENTS[i], lock = lockReason(it);
  if (lock) { $('you').textContent = lock; $('you').style.color = 'var(--red)'; setTimeout(()=>{ $('you').style.color=''; }, 900); return; }
  $('you').textContent = 'You: ' + it.you;
  const l = npc.lines[it.id];
  if (it.id==='give') startGesture('small_smile'); else if (it.id==='order') startGesture('nod'); else if (it.id==='gossip') startGesture('eyebrow_raise'); else if (it.id==='small') startGesture('head_tilt'); else if (it.id==='help' && rel<.4) startGesture('shrug');
  setTimeout(() => { say(l); setRel(rel + it.eff/100, it.eff); }, 260);
  $('thinks').textContent = '';
  if (it.id==='hangs') $('thinks').textContent = '→ social graph: closest ties shown as a follow-up row of faces';
}
function openConv(who) {
  npc = who || npc; open = true; stage.classList.remove('off');
  const uni = DIV[npc.div]; document.documentElement.style.setProperty('--u', uni);
  $('nm').textContent = npc.short.replace(/^[^ ]+ /,''); $('ttl').textContent = npc.title;
  const pr = RANKS[npc.rank];
  $('pips').innerHTML = `<span class="pip rank" title="rank">${'●'.repeat(Math.min(5,npc.rank+1))}<span class="e">${'○'.repeat(Math.max(0,5-npc.rank-1))}</span> <span style="color:var(--ink);letter-spacing:.06em;font-size:11px">${pr}</span></span><span class="pip"><i></i>${npc.dept.toUpperCase()}</span><span class="pip">${npc.tags.filter(t=>!t.includes(':')).concat(npc.tags.filter(t=>t.includes(':')).map(t=>t.split(':')[1])).slice(0,2).join(' · ')}</span>`;
  buildFace(); rel = npc.trust; setRel(rel, 0); $('delta').classList.remove('go'); $('you').textContent = '';
  $('clk').textContent = '0742'; $('subNm').textContent = ''; $('subTx').textContent = '';
  setTimeout(() => { if (open) { startGesture('nod'); $('you').textContent = 'You approach ' + npc.short + '. They stop what they are doing and turn to you.'; setTimeout(()=>{ if(open) say(npc.lines.greet); }, 600); } }, 700);
  document.querySelectorAll('#pick button').forEach(b => b.classList.toggle('on', b.dataset.id===npc.id));
}
function end() { open = false; clearInterval(typeTimer); stage.classList.add('off'); speaking = 0; $('tip').style.opacity = 0; }

addEventListener('keydown', (e) => {
  if (e.code==='KeyE') { open ? end() : openConv(); }
  else if (e.code==='Escape' && open) end();
  else if (open) { const m = /^(?:Digit|Numpad)(\d)$/.exec(e.code); if (m && +m[1]>=1 && +m[1]<=8) choose(+m[1]-1); }
});
$('bOpen').onclick = () => open ? end() : openConv();
$('cItem').onchange = buildWheel; $('cRank').onchange = buildWheel;
const pk = $('pick'); CAST.forEach(c => { const b = document.createElement('button'); b.dataset.id = c.id; b.textContent = c.short; b.onclick = () => { openConv(c); }; pk.appendChild(b); });
buildWheel(); renderMood(); requestAnimationFrame(frame);
const q = new URLSearchParams(location.search); if (q.get('npc')) openConv(CAST.find(c=>c.id===q.get('npc'))||CAST[0]); else setTimeout(()=>openConv(), 200);
if (q.get('say')) setTimeout(()=>choose(+q.get('say')), 1700);
</script>
</body>
