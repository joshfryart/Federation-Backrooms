<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Contact Sheet</title>
<style>
  :root { --bg:#0d0f12; --panel:#161a20; --text:#f2f4f8; --muted:#a3acbb; --accent:#7fb8ff; --fail:#ff6b6b; --rule:#2a303a; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg:#f4f5f7; --panel:#ffffff; --text:#111418; --muted:#4a5363; --accent:#1b5fc1; --fail:#c62828; --rule:#c9ced8; }
  }
  :root[data-theme="dark"] { --bg:#0d0f12; --panel:#161a20; --text:#f2f4f8; --muted:#a3acbb; --accent:#7fb8ff; --fail:#ff6b6b; --rule:#2a303a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  h1 { font-size:24px; font-weight:700; margin:0 0 4px; color:var(--text); }
  .intro { color:var(--muted); margin:0 0 20px; }
  section { margin-bottom:28px; }
  h2 { font-size:16px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); border-bottom:1px solid var(--rule); padding-bottom:6px; margin:0 0 12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  figure { margin:0; background:var(--panel); border-radius:8px; overflow:hidden; border:1px solid var(--rule); }
  figure img { display:block; width:100%; height:auto; aspect-ratio:4/3; object-fit:contain; background:#000; }
  .nopic { aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; background:#000; color:var(--fail); font-weight:700; }
  figcaption { padding:8px 10px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; color:var(--text); }
  figure.failed { border-color:var(--fail); }
  .status { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  figure.failed .status { color:var(--fail); font-weight:700; }
  img { max-width:100%; }
</style>
</head>
<body>
<h1>Model Contact Sheet</h1>
<p class="intro">Headless Chromium screenshots, 640x480, one per URL. Source: models.html and index.html via local static server.</p>

<section>

</html>
