<!doctype html><meta charset="utf-8"><title>Model viewer — Starfarers: The Backdecks</title>
<style>html,body{margin:0;background:#0b0e16;overflow:hidden;font-family:Arial;color:#fff}canvas{display:block;width:100vw;height:100vh}
#l{position:fixed;top:8px;left:10px;font-size:12px;letter-spacing:.08em;opacity:.75;line-height:1.6}#l a{color:#9cf;margin-right:10px;text-decoration:none}
.tag{position:fixed;transform:translate(-50%,0);font-size:11px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;pointer-events:none;text-shadow:0 1px 3px #000}</style>
<canvas id="c"></canvas><div id="l"><a href="?set=crew">crew</a><a href="?set=enemies">enemies</a><a href="?set=misc">items &amp; creatures</a><a href="?set=props">props</a><br>drag to orbit · wheel to zoom · ?clip=walk|jog|sprint|dance|death01|sitting_idle… · ?only=name</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import { makeGorn, animateGorn, makeCrew, makeTribble, makeItem, makeViewmodel } from './js/actors.js';
import { loadModels, loadTextures } from './js/assets.js';
import { makeHuman, holoMaterial, DIVISIONS, liveFace } from './js/humans.js';
import { MODELS } from './js/enemies.js';
import { buildProp, PROP_KINDS } from './js/world.js';
import { RoomEnvironment } from 'three/addons/RoomEnvironment.js';
const q = new URLSearchParams(location.search); const set = q.get('set') || 'crew', only = q.get('only'), clip = q.get('clip');
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight, false); r.shadowMap.enabled = true; r.toneMapping = THREE.AgXToneMapping; r.toneMappingExposure = 1.1;
const s = new THREE.Scene(); s.background = new THREE.Color(q.get('dark') ? 0x05060a : 0x1a1f2c);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 100);
{ const pm = new THREE.PMREMGenerator(r); s.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; s.environmentIntensity = q.get('dark') ? 0.08 : 0.55; }
const key = new THREE.DirectionalLight(0xfff0d8, q.get('dark') ? 0.5 : 2.4); key.position.set(3, 6, 6); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -12, right: 12, top: 8, bottom: -4 }); s.add(key);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), new THREE.MeshStandardMaterial({ color: 0x2a3040, roughness: 0.9 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; s.add(floor);
await Promise.all([loadModels(), loadTextures()]);
const list = []; const add = (name, mesh, tick, w = 1.1) => { if (mesh && (!only || only.split(',').includes(name.toLowerCase().replace(/\W+/g, '')))) list.push({ name, mesh, tick, w }); };
const hum = (o, c = clip || 'idle', face) => { const m = makeHuman(o); if (!m) return [null]; const H = m.userData.human; H.play(c); if (face) H.face(face); return [m, (dt, t) => { if (!face) liveFace(H, t, m.id); H.update(dt); }]; };
const enemy = (k, speed, flags = {}) => { const m = MODELS[k](); return [m.mesh, (dt) => m.tick(dt, speed, flags), 1.5]; };
if (set === 'crew') {
  add('Command (m)', ...hum({ kind: 'crew_m', uniform: DIVISIONS[1], rank: 6 })); add('Security (f)', ...hum({ kind: 'crew_f', uniform: DIVISIONS[0], rank: 2 }, clip || 'idle_talking')); add('Science (f)', ...hum({ kind: 'crew_f2', uniform: DIVISIONS[2], rank: 4 }));
  add('Engineer', ...hum({ kind: 'crew_heavy', uniform: 0xb8862a, rank: 3 }, clip || 'idle')); add('Walking', ...hum({ kind: 'crew_m', uniform: DIVISIONS[0] }, clip || 'walk'));
  add('Cowering survivor', ...hum({ kind: 'crew_f', uniform: DIVISIONS[2] }, clip || 'crouch_idle')); add('Sitting', ...hum({ kind: 'crew_f2', uniform: DIVISIONS[1] }, clip || 'sitting_idle'));
  add('Medical hologram', ...hum({ kind: 'crew_f2', material: holoMaterial(0x6ad8ff, 0.8), shadow: false }, clip || 'idle_talking'));
  { const m = makeHuman({ kind: 'crew_m', uniform: DIVISIONS[0], bloody: 1, pale: 0.4, shadow: false }); if (m) { m.userData.human.pose('death01', 1); m.userData.human.face({ JawDrop: 0.5, LeftUpperLidClosed: 0.6, RightUpperLidClosed: 0.8 }); } add('Fallen crewman', m, null, 2.2); }
} else if (set === 'enemies') {
  { const g = makeGorn(); let t = 0; add('Gronk', g, (dt) => { t += dt; animateGorn(g, 1.2, t, Math.sin(t * 0.5) > 0.7); }, 2.2); }
  add('Space-madness (run)', ...enemy('crazed', 4.6)); add('Space-madness (attack)', ...enemy('crazed', 0, { attacking: true }));
  add('Compliance Drone', ...enemy('drone', 1.7)); add('Mr. Grinsworth', ...enemy('phantom', 1)); add('Grinsworth (watched)', ...enemy('phantom', 0, { frozen: true }));
  add('Slimeling impostor', ...enemy('slimeling', 4.2)); add('Clingon Crawler', ...enemy('clinger', 0)); add('Crawler (running)', ...enemy('clinger', 4));
} else if (set === 'misc') {
  for (const k of ['chip', 'battery', 'medkit']) { const m = makeItem(k); add(k, m, (dt) => { m.rotation.y += dt; }, 0.8); }
  add('Furble', makeTribble(), null, 0.8); const f2 = makeTribble(); f2.scale.setScalar(2.5); add('Furble (close)', f2, null, 1.3);
  const vm = makeViewmodel(); if (vm) { vm.group.position.y = 1.2; vm.group.scale.setScalar(3); add('Zapper (viewmodel ×3)', vm.group, null, 2); }
} else if (set === 'props') { for (const k of PROP_KINDS) add(k, buildProp(k), null, 2.6); }
let x = 0; const total = list.reduce((a, l) => a + l.w, 0);
for (const l of list) { l.mesh.position.x = x + l.w / 2 - total / 2; x += l.w; l.mesh.traverse(o => { if (o.isMesh && o.material?.type !== 'ShaderMaterial' && !o.material?.transparent) { o.castShadow = true; o.receiveShadow = true; } }); s.add(l.mesh);
  l.el = document.createElement('div'); l.el.className = 'tag'; l.el.textContent = l.name; document.body.appendChild(l.el); }
// orbit camera
const C = (q.get('cam') || '').split(',').map(Number); let tgt = new THREE.Vector3(C[3] || 0, C[4] ?? 1.0, C[5] || 0), yaw = 0, pitch = 0.08, dist = Math.max(3.5, total * 0.72);
if (C.length >= 3 && q.get('cam')) { const p = new THREE.Vector3(C[0], C[1], C[2]).sub(tgt); dist = p.length(); yaw = Math.atan2(p.x, p.z); pitch = Math.asin(p.y / dist); }
let drag = false; addEventListener('pointerdown', () => drag = true); addEventListener('pointerup', () => drag = false);
addEventListener('pointermove', e => { if (drag) { yaw -= e.movementX * 0.006; pitch = Math.max(-0.2, Math.min(1.3, pitch + e.movementY * 0.005)); } });
addEventListener('wheel', e => { dist *= e.deltaY > 0 ? 1.1 : 0.9; });
addEventListener('resize', () => { r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
const clock = new THREE.Clock(); let t = 0; const v = new THREE.Vector3();
function frame() {
  requestAnimationFrame(frame); const dt = Math.min(0.05, clock.getDelta()); t += dt;
  for (const l of list) l.tick?.(dt, t);
  cam.position.set(tgt.x + Math.sin(yaw) * Math.cos(pitch) * dist, tgt.y + Math.sin(pitch) * dist, tgt.z + Math.cos(yaw) * Math.cos(pitch) * dist); cam.lookAt(tgt);
  for (const l of list) { v.set(l.mesh.position.x, -0.08, 0.5).project(cam); l.el.style.left = (v.x * 0.5 + 0.5) * innerWidth + 'px'; l.el.style.top = (-v.y * 0.5 + 0.5) * innerHeight + 'px'; }
  r.render(s, cam);
}
frame(); window.__ready = true;
</script>
