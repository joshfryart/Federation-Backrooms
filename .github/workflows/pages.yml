name: Pages

# Needs Settings -> Pages -> Build and deployment -> Source: "GitHub Actions" (a repository setting; until it is set,
# the deploy job fails with "Failed to create deployment (status: 404) ... Ensure GitHub Pages has been enabled").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued deploy is not cancelled by a newer push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Allowlist, not a copy of the repo: tools/, node_modules/, .git/, .github/ and docs/ stay out (nothing at runtime
      # loads from docs/; it is ~130 MB of notes and media). The 701 job source files js/jobs/<billet>__<slug>.js stay out
      # too: the game loads the generated bundle js/jobs/index.js (plus kit.js / host.js), never the single files.
      # js/meshlod-worker.js (crowd LOD worker) ships with js/. All asset references are relative, so the site works under /<repo>/.
      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site && mkdir _site
          cp ./*.html ./CREDITS.md _site/
          cp -r css js assets vendor _site/
          find _site/js/jobs -maxdepth 1 -name '*__*.js' -delete
          test -f _site/js/jobs/index.js && test -f _site/js/jobs/kit.js && test -f _site/js/jobs/host.js && test -f _site/js/meshlod-worker.js
          du -sh _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
