name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  node-tests:
    name: Node-only unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every module
        run: for f in js/*.js tools/*.mjs; do node --check "$f" || exit 1; done
      - name: Run tools/test-*.mjs (no browser)
        run: |
          for f in tools/test-*.mjs; do
            echo "::group::$f"
            node "$f" || exit 1
            echo "::endgroup::"
          done
  smoke:
    name: Headless smoke test (Playwright + Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tools/test.mjs does require('playwright') and chromium.launch() with SwiftShader (software GL) flags: no GPU needed
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: node tools/test.mjs
        run: node tools/test.mjs
