name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes a queued / running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node tests and job validators
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # tools/test.mjs does `require('playwright')` at module load, so the package must resolve even for the node-only
      # sections. No browser is downloaded in this job. Same version as the dev machine (playwright 1.63.0).
      - name: Install playwright module (no browser)
        run: npm install --no-save --no-package-lock playwright@1.63.0

      # Every [node] section of `node tools/test.mjs --list` (unit suites, generator, ship decks, inventory rooms,
      # director cascade, crew voices, pace presets, perf governor, smoke / liminal / audio units, ...).
      # The jobgames-unit section also checks that js/jobs/index.js matches the job files.
      - name: Generator and unit tests (node-only sections)
        run: node tools/test.mjs --node

      - name: Validate all job modules
        run: node tools/check-jobs.mjs --all --quiet

      # Collisions between job modules, and a stale generated bundle js/jobs/index.js.
      - name: Check job registry is up to date
        run: node tools/merge-jobs.mjs --check

  browser:
    name: Full test suite (headless Chromium, SwiftShader)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install playwright module
        run: npm install --no-save --no-package-lock playwright@1.63.0

      # tools/test.mjs launches Chromium's new headless mode (channel 'chromium'), not chrome-headless-shell; WebGL runs on SwiftShader.
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps --no-shell chromium

      # The full suite: the node-only sections again, every browser section page by page, then the smoke on the seed set
      # (~170 s on a 4-core dev box, 3/3 OK after the walk / wiring flake fixes, see TODO.md). Each browser section is
      # re-seeded, so a FAIL line prints a replay command (`node tools/test.mjs --only <section> --seed N`) that reproduces it.
      - name: Full test suite (node + browser)
        run: node tools/test.mjs
